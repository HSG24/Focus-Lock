<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Lock · Shared Stats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F6F7FA;
      --surface: #FFFFFF;
      --surface-soft: #ECEFF4;
      --border: #E4E8EF;
      --text: #111318;
      --muted: #5D6573;
      --primary: #364FC7;
      --primary-container: #EEF2FF;
      --primary-on-container: #1A2559;
      --emerald: #10B981;
      --emerald-soft: rgba(16, 185, 129, 0.12);
      --error: #DC2626;
      --shadow: 0 12px 32px rgba(17, 19, 24, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0A0C10;
        --surface: #12161F;
        --surface-soft: #1A202C;
        --border: #1E2430;
        --text: #F1F4F9;
        --muted: #939DAE;
        --primary: #748FFC;
        --primary-container: #1C2547;
        --primary-on-container: #DDE5FF;
        --emerald: #10B981;
        --emerald-soft: rgba(16, 185, 129, 0.14);
        --error: #F87171;
        --shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0A0C10;
      --surface: #12161F;
      --surface-soft: #1A202C;
      --border: #1E2430;
      --text: #F1F4F9;
      --muted: #939DAE;
      --primary: #748FFC;
      --primary-container: #1C2547;
      --primary-on-container: #DDE5FF;
      --emerald: #10B981;
      --emerald-soft: rgba(16, 185, 129, 0.14);
      --error: #F87171;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 44px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--primary-container);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    .brand-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .theme-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .theme-btn:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 14px;
      border-radius: 16px;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge-live {
      background: var(--emerald-soft);
      color: var(--emerald);
    }

    .badge-snapshot {
      background: var(--primary-container);
      color: var(--primary-on-container);
    }

    .badge-ended {
      background: var(--surface-soft);
      color: var(--muted);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      position: relative;
      flex-shrink: 0;
    }

    .pulse-dot::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--emerald);
      opacity: 0.45;
      animation: pulse 1.8s ease-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.55; }
      70% { transform: scale(2.1); opacity: 0; }
      100% { transform: scale(2.1); opacity: 0; }
    }

    .range-caption {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .segmented {
      display: inline-flex;
      background: var(--surface-soft);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }

    .seg-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    /* Sleek Day Navigation Bar */
    .date-bar-wrap {
      position: relative;
    }

    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      border-radius: 16px;
      gap: 4px;
    }

    .nav-arrow-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, opacity 0.15s ease;
      flex-shrink: 0;
    }

    .nav-arrow-btn:hover:not(:disabled) {
      background: var(--surface-soft);
    }

    .nav-arrow-btn:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .date-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .date-picker-trigger {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 7px 10px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background-color 0.15s ease;
    }

    .date-picker-trigger:hover {
      background: var(--surface-soft);
    }

    .custom-chevron {
      color: var(--muted);
      transition: transform 0.18s ease;
    }

    .custom-chevron.open {
      transform: rotate(180deg);
    }

    .today-jump-btn {
      appearance: none;
      border: none;
      background: var(--primary-container);
      color: var(--primary);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .today-jump-btn:hover {
      opacity: 0.88;
    }

    /* Minimal Custom Date Calendar Popover */
    .calendar-popover {
      margin-top: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
      animation: fadeSlide 0.15s ease-out;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .cal-month-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-day {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      font-weight: 500;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    .cal-day:hover:not(:disabled) {
      background: var(--surface-soft);
    }

    .cal-day:disabled {
      color: var(--muted);
      opacity: 0.28;
      cursor: default;
    }

    .cal-day.today:not(.selected) {
      border: 1px solid var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    .cal-day.selected {
      background: var(--primary);
      color: #FFFFFF;
      font-weight: 700;
    }

    .cal-day .activity-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--emerald);
      position: absolute;
      bottom: 4px;
    }

    .cal-day.selected .activity-dot {
      background: #FFFFFF;
    }

    /* Hero & Metrics */
    .hero-card {
      text-align: center;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .micro-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hero-value {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(38px, 10vw, 48px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--text);
    }

    .session-pill {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--primary-container);
      color: var(--primary-on-container);
    }

    .session-pill.active-now {
      background: var(--emerald-soft);
      color: var(--emerald);
      font-family: "JetBrains Mono", monospace;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .mini-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .mini-value {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .mini-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 0;
      font-size: 12px;
      color: var(--muted);
    }

    .state-card {
      text-align: center;
      padding: 44px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .state-title {
      font-size: 18px;
      font-weight: 700;
    }

    .state-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 340px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <span class="brand-name">Focus Lock</span>
      </div>
      <button id="themeToggle" class="theme-btn" type="button" aria-label="Toggle color theme">
        <span id="themeLabel">Theme</span>
      </button>
    </header>

    <section id="loadingState" class="card state-card">
      <div class="spinner"></div>
      <div class="state-title">Loading focus stats</div>
      <p class="state-desc">Connecting to Focus Lock…</p>
    </section>

    <section id="errorState" class="card state-card hidden">
      <div class="state-title" id="errorTitle">Stats link unavailable</div>
      <p class="state-desc" id="errorDesc">This share link could not be found or has expired.</p>
    </section>

    <section id="statsView" class="hidden" style="display: flex; flex-direction: column; gap: 12px;">
      <!-- Mode Badge + Range Window + Daily/Overall Toggle -->
      <div class="card meta-bar">
        <div class="meta-left">
          <span id="modeBadge" class="badge badge-snapshot">SNAPSHOT</span>
          <span id="dateLabel" class="range-caption">—</span>
        </div>
        <div id="viewModeToggle" class="segmented" role="tablist" aria-label="Stats view mode">
          <button id="btnViewDaily" class="seg-btn active" type="button" role="tab" aria-selected="true">Daily</button>
          <button id="btnViewOverall" class="seg-btn" type="button" role="tab" aria-selected="false">Overall</button>
        </div>
      </div>

      <!-- Sleek Date Navigation Bar (Daily View) -->
      <div id="dateBarWrap" class="date-bar-wrap">
        <div class="card date-bar">
          <button id="prevDayBtn" class="nav-arrow-btn" type="button" aria-label="Previous Day" title="Previous Day">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>

          <div class="date-center">
            <button id="customDateTrigger" class="date-picker-trigger" type="button" aria-label="Select custom date">
              <span id="selectedDayText">Today</span>
              <svg id="customChevron" class="custom-chevron" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>

            <button id="todayJumpBtn" class="today-jump-btn hidden" type="button">
              <span id="todayJumpLabel">Today</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>

          <button id="nextDayBtn" class="nav-arrow-btn" type="button" aria-label="Next Day" title="Next Day">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>

        <!-- Minimal Inline Calendar Popover -->
        <div id="calendarPopover" class="calendar-popover hidden">
          <div class="cal-header">
            <button id="calPrevMonth" class="nav-arrow-btn" type="button" aria-label="Previous month" style="width:34px;height:34px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
            <span id="calMonthTitle" class="cal-month-title">November 2026</span>
            <button id="calNextMonth" class="nav-arrow-btn" type="button" aria-label="Next month" style="width:34px;height:34px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
          <div class="cal-weekdays">
            <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
          </div>
          <div id="calGrid" class="cal-grid"></div>
        </div>
      </div>

      <!-- Hero Focus Time Card -->
      <div class="card hero-card">
        <span id="heroMicroLabel" class="micro-label">Total Focus Time</span>
        <div id="heroTotalTime" class="hero-value">0s</div>
        <div id="sessionStatusPill" class="session-pill">0 sessions recorded</div>
      </div>

      <!-- 3-Column Metrics -->
      <div class="metrics-grid">
        <div class="mini-card">
          <div id="metricSessions" class="mini-value">0</div>
          <div class="mini-label">Total Sessions</div>
        </div>
        <div class="mini-card">
          <div id="metricAverage" class="mini-value">0s</div>
          <div class="mini-label">Average</div>
        </div>
        <div class="mini-card">
          <div id="metricLongest" class="mini-value">0s</div>
          <div class="mini-label">Longest</div>
        </div>
      </div>

      <footer class="footer">
        <span id="footerModeHint">Shared Focus Lock summary</span>
        <span id="lastUpdatedText">—</span>
      </footer>
    </section>
  </main>

  <script>
    (function () {
      const RTDB_BASE = "https://focuslock-b6c0f-default-rtdb.asia-southeast1.firebasedatabase.app";
      const params = new URLSearchParams(window.location.search);
      const shareId = params.get("id");

      const loadingEl = document.getElementById("loadingState");
      const errorEl = document.getElementById("errorState");
      const errorTitleEl = document.getElementById("errorTitle");
      const errorDescEl = document.getElementById("errorDesc");
      const statsViewEl = document.getElementById("statsView");

      const modeBadgeEl = document.getElementById("modeBadge");
      const dateLabelEl = document.getElementById("dateLabel");
      const viewModeToggleEl = document.getElementById("viewModeToggle");
      const btnViewDaily = document.getElementById("btnViewDaily");
      const btnViewOverall = document.getElementById("btnViewOverall");

      const dateBarWrapEl = document.getElementById("dateBarWrap");
      const prevDayBtn = document.getElementById("prevDayBtn");
      const nextDayBtn = document.getElementById("nextDayBtn");
      const customDateTrigger = document.getElementById("customDateTrigger");
      const customChevron = document.getElementById("customChevron");
      const selectedDayTextEl = document.getElementById("selectedDayText");
      const todayJumpBtn = document.getElementById("todayJumpBtn");
      const todayJumpLabelEl = document.getElementById("todayJumpLabel");

      const calendarPopover = document.getElementById("calendarPopover");
      const calPrevMonth = document.getElementById("calPrevMonth");
      const calNextMonth = document.getElementById("calNextMonth");
      const calMonthTitle = document.getElementById("calMonthTitle");
      const calGrid = document.getElementById("calGrid");

      const heroMicroLabelEl = document.getElementById("heroMicroLabel");
      const heroTotalTimeEl = document.getElementById("heroTotalTime");
      const sessionStatusPillEl = document.getElementById("sessionStatusPill");
      const metricSessionsEl = document.getElementById("metricSessions");
      const metricAverageEl = document.getElementById("metricAverage");
      const metricLongestEl = document.getElementById("metricLongest");
      const footerModeHintEl = document.getElementById("footerModeHint");
      const lastUpdatedTextEl = document.getElementById("lastUpdatedText");

      // Theme toggle
      const themeToggle = document.getElementById("themeToggle");
      const themeLabel = document.getElementById("themeLabel");
      const savedTheme = localStorage.getItem("fl_theme");
      if (savedTheme === "dark" || savedTheme === "light") {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
      function updateThemeLabel() {
        const current = document.documentElement.getAttribute("data-theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark = current ? current === "dark" : prefersDark;
        themeLabel.textContent = isDark ? "Dark" : "Light";
      }
      updateThemeLabel();
      themeToggle.addEventListener("click", function () {
        const current = document.documentElement.getAttribute("data-theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark = current ? current === "dark" : prefersDark;
        const next = isDark ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("fl_theme", next);
        updateThemeLabel();
      });

      // Date helpers using YYYY-MM-DD keys
      function toDateKey(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + d;
      }

      function parseDateKey(key) {
        const parts = key.split("-");
        return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      }

      function addDaysToKey(key, delta) {
        const d = parseDateKey(key);
        d.setDate(d.getDate() + delta);
        return toDateKey(d);
      }

      function todayKey() {
        return toDateKey(new Date());
      }

      function formatSelectedDayLabel(key) {
        const nowKey = todayKey();
        const yestKey = addDaysToKey(nowKey, -1);
        if (key === nowKey) return "Today";
        if (key === yestKey) return "Yesterday";
        const d = parseDateKey(key);
        const sameYear = d.getFullYear() === new Date().getFullYear();
        return new Intl.DateTimeFormat(undefined, sameYear
          ? { weekday: "short", month: "short", day: "numeric" }
          : { month: "short", day: "numeric", year: "numeric" }
        ).format(d);
      }

      let currentRecord = null;
      let viewMode = "daily"; // "daily" | "overall"
      let selectedDateKey = todayKey();
      let calOpen = false;
      let calYear = new Date().getFullYear();
      let calMonth = new Date().getMonth();
      let tickInterval = null;
      let eventSource = null;

      function getBounds(record) {
        const minKey = record.startDateKey || (record.startDateMs ? toDateKey(new Date(record.startDateMs)) : todayKey());
        let maxKey;
        if (record.mode === "live" && record.status === "active") {
          maxKey = todayKey();
        } else {
          maxKey = record.endDateKey || (record.endDateMs ? toDateKey(new Date(record.endDateMs)) : minKey);
        }
        if (maxKey < minKey) maxKey = minKey;
        return { minKey, maxKey };
      }

      function formatReadableDuration(ms) {
        if (!ms || ms <= 0) return "0s";
        const totalSec = Math.floor(ms / 1000);
        const hrs = Math.floor(totalSec / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        if (hrs > 0) return hrs + "h " + mins + "m";
        if (mins > 0) return mins + "m " + secs + "s";
        return secs + "s";
      }

      function formatCompactDuration(ms) {
        if (!ms || ms <= 0) return "0s";
        const totalMin = Math.floor(ms / 60000);
        const hrs = Math.floor(totalMin / 60);
        const remMin = totalMin % 60;
        const secs = Math.floor((ms % 60000) / 1000);
        if (hrs > 0) return hrs + "h " + remMin + "m";
        if (totalMin > 0) return totalMin + "m";
        return secs + "s";
      }

      function formatTimerClock(ms) {
        const totalSec = Math.max(0, Math.floor(ms / 1000));
        const hrs = Math.floor(totalSec / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        const pad = (n) => String(n).padStart(2, "0");
        return hrs > 0 ? pad(hrs) + ":" + pad(mins) + ":" + pad(secs) : pad(mins) + ":" + pad(secs);
      }

      function formatDateRange(record) {
        const bounds = getBounds(record);
        const start = parseDateKey(bounds.minKey);
        const fmtFull = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" });
        const fmtShort = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" });

        if (record.mode === "live" && record.status === "active") {
          return "Since " + fmtFull.format(start);
        }
        const end = parseDateKey(bounds.maxKey);
        if (bounds.minKey === bounds.maxKey) {
          return fmtFull.format(start);
        }
        const sameYear = start.getFullYear() === end.getFullYear();
        return (sameYear ? fmtShort.format(start) : fmtFull.format(start)) + " – " + fmtFull.format(end);
      }

      function showError(title, desc) {
        loadingEl.classList.add("hidden");
        statsViewEl.classList.add("hidden");
        errorTitleEl.textContent = title;
        errorDescEl.textContent = desc;
        errorEl.classList.remove("hidden");
      }

      function renderCalendar() {
        if (!calOpen || !currentRecord) {
          calendarPopover.classList.add("hidden");
          customChevron.classList.remove("open");
          return;
        }
        calendarPopover.classList.remove("hidden");
        customChevron.classList.add("open");

        const { minKey, maxKey } = getBounds(currentRecord);
        const monthDate = new Date(calYear, calMonth, 1);
        calMonthTitle.textContent = new Intl.DateTimeFormat(undefined, { month: "long", year: "numeric" }).format(monthDate);

        const minDate = parseDateKey(minKey);
        const maxDate = parseDateKey(maxKey);
        const canPrevMonth = calYear > minDate.getFullYear() || (calYear === minDate.getFullYear() && calMonth > minDate.getMonth());
        const canNextMonth = calYear < maxDate.getFullYear() || (calYear === maxDate.getFullYear() && calMonth < maxDate.getMonth());
        calPrevMonth.disabled = !canPrevMonth;
        calNextMonth.disabled = !canNextMonth;

        const firstDayOfWeek = monthDate.getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        const dailyMap = currentRecord.dailyStats || {};
        const nowK = todayKey();

        calGrid.innerHTML = "";
        for (let i = 0; i < firstDayOfWeek; i++) {
          const spacer = document.createElement("div");
          calGrid.appendChild(spacer);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const d = new Date(calYear, calMonth, day);
          const key = toDateKey(d);
          const inRange = key >= minKey && key <= maxKey;

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "cal-day";
          if (key === selectedDateKey) btn.classList.add("selected");
          if (key === nowK) btn.classList.add("today");
          btn.disabled = !inRange;
          btn.textContent = String(day);

          if (inRange && dailyMap[key] && Number(dailyMap[key].totalFocusMs || 0) > 0) {
            const dot = document.createElement("span");
            dot.className = "activity-dot";
            btn.appendChild(dot);
          }

          if (inRange) {
            btn.addEventListener("click", function () {
              selectedDateKey = key;
              calOpen = false;
              render();
            });
          }
          calGrid.appendChild(btn);
        }
      }

      function render() {
        if (!currentRecord) {
          showError("Share link not found", "This link may have been deleted or does not exist.");
          return;
        }

        loadingEl.classList.add("hidden");
        errorEl.classList.add("hidden");
        statsViewEl.classList.remove("hidden");

        const supportsDaily = Boolean(currentRecord.startDateKey || currentRecord.dailyStats);
        viewModeToggleEl.classList.toggle("hidden", !supportsDaily);
        if (!supportsDaily) {
          viewMode = "overall";
        }

        btnViewDaily.classList.toggle("active", viewMode === "daily");
        btnViewDaily.setAttribute("aria-selected", viewMode === "daily" ? "true" : "false");
        btnViewOverall.classList.toggle("active", viewMode === "overall");
        btnViewOverall.setAttribute("aria-selected", viewMode === "overall" ? "true" : "false");

        const { minKey, maxKey } = getBounds(currentRecord);
        if (selectedDateKey < minKey) selectedDateKey = minKey;
        if (selectedDateKey > maxKey) selectedDateKey = maxKey;

        const isLive = currentRecord.mode === "live";
        const isLiveActive = isLive && currentRecord.status === "active";
        const activeSession = currentRecord.activeSession || {};
        const isInSession = isLiveActive && Boolean(activeSession.isActive) && activeSession.startTime > 0;
        const activeSessionKey = isInSession
          ? (activeSession.dateKey || toDateKey(new Date(Number(activeSession.startTime))))
          : "";

        if (isLiveActive) {
          modeBadgeEl.className = "badge badge-live";
          modeBadgeEl.innerHTML = '<span class="pulse-dot"></span><span>' + (isInSession ? "LIVE · IN SESSION" : "LIVE") + "</span>";
          footerModeHintEl.textContent = "Live updates enabled";
        } else if (isLive && currentRecord.status === "stopped") {
          modeBadgeEl.className = "badge badge-ended";
          modeBadgeEl.textContent = "LIVE · ENDED";
          footerModeHintEl.textContent = "Live sharing stopped";
        } else {
          modeBadgeEl.className = "badge badge-snapshot";
          modeBadgeEl.textContent = "SNAPSHOT";
          footerModeHintEl.textContent = "Static date snapshot";
        }

        dateLabelEl.textContent = formatDateRange(currentRecord);

        // Date bar visibility & state
        dateBarWrapEl.classList.toggle("hidden", viewMode !== "daily");
        if (viewMode === "daily") {
          prevDayBtn.disabled = selectedDateKey <= minKey;
          nextDayBtn.disabled = selectedDateKey >= maxKey;
          selectedDayTextEl.textContent = formatSelectedDayLabel(selectedDateKey);

          const nowK = todayKey();
          const jumpTargetKey = (nowK >= minKey && nowK <= maxKey) ? nowK : maxKey;
          const showJump = selectedDateKey !== jumpTargetKey;
          todayJumpBtn.classList.toggle("hidden", !showJump);
          todayJumpLabelEl.textContent = jumpTargetKey === nowK ? "Today" : "Latest";
          renderCalendar();
        }

        // Compute displayed metrics (either for selected day or overall)
        let baseStats;
        let includeActiveHere = false;
        if (viewMode === "daily") {
          const dailyMap = currentRecord.dailyStats || {};
          baseStats = dailyMap[selectedDateKey] || { totalFocusMs: 0, sessionCount: 0, averageMs: 0, longestMs: 0 };
          includeActiveHere = isInSession && selectedDateKey === activeSessionKey;
          heroMicroLabelEl.textContent = "Focus Time · " + formatSelectedDayLabel(selectedDateKey);
        } else {
          baseStats = currentRecord.stats || { totalFocusMs: 0, sessionCount: 0, averageMs: 0, longestMs: 0 };
          includeActiveHere = isInSession;
          heroMicroLabelEl.textContent = "Overall Focus Time";
        }

        const baseTotalMs = Number(baseStats.totalFocusMs || 0);
        const baseCount = Number(baseStats.sessionCount || 0);
        const baseLongestMs = Number(baseStats.longestMs || 0);

        const activeElapsedMs = includeActiveHere ? Math.max(0, Date.now() - Number(activeSession.startTime)) : 0;
        const effectiveTotalMs = baseTotalMs + activeElapsedMs;
        const effectiveCount = baseCount + (includeActiveHere ? 1 : 0);
        const effectiveLongestMs = includeActiveHere ? Math.max(baseLongestMs, activeElapsedMs) : baseLongestMs;
        const effectiveAvgMs = effectiveCount > 0 ? Math.floor(effectiveTotalMs / effectiveCount) : 0;

        heroTotalTimeEl.textContent = formatReadableDuration(effectiveTotalMs);
        metricSessionsEl.textContent = String(effectiveCount);
        metricAverageEl.textContent = formatCompactDuration(effectiveAvgMs);
        metricLongestEl.textContent = formatCompactDuration(effectiveLongestMs);

        if (includeActiveHere) {
          sessionStatusPillEl.className = "session-pill active-now";
          sessionStatusPillEl.textContent = "Focusing now · " + formatTimerClock(activeElapsedMs);
        } else {
          sessionStatusPillEl.className = "session-pill";
          sessionStatusPillEl.textContent =
            effectiveCount === 1 ? "1 session recorded" : effectiveCount + " sessions recorded";
        }

        if (currentRecord.updatedAt) {
          const updatedDate = new Date(currentRecord.updatedAt);
          lastUpdatedTextEl.textContent =
            "Updated " + updatedDate.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        } else {
          lastUpdatedTextEl.textContent = "";
        }
      }

      // Navigation handlers
      btnViewDaily.addEventListener("click", function () {
        viewMode = "daily";
        calOpen = false;
        render();
      });

      btnViewOverall.addEventListener("click", function () {
        viewMode = "overall";
        calOpen = false;
        render();
      });

      prevDayBtn.addEventListener("click", function () {
        if (!currentRecord) return;
        const { minKey } = getBounds(currentRecord);
        const prev = addDaysToKey(selectedDateKey, -1);
        if (prev >= minKey) {
          selectedDateKey = prev;
          calOpen = false;
          render();
        }
      });

      nextDayBtn.addEventListener("click", function () {
        if (!currentRecord) return;
        const { maxKey } = getBounds(currentRecord);
        const next = addDaysToKey(selectedDateKey, 1);
        if (next <= maxKey) {
          selectedDateKey = next;
          calOpen = false;
          render();
        }
      });

      todayJumpBtn.addEventListener("click", function () {
        if (!currentRecord) return;
        const { minKey, maxKey } = getBounds(currentRecord);
        const nowK = todayKey();
        selectedDateKey = (nowK >= minKey && nowK <= maxKey) ? nowK : maxKey;
        calOpen = false;
        render();
      });

      function toggleCalendar() {
        calOpen = !calOpen;
        if (calOpen) {
          const selDate = parseDateKey(selectedDateKey);
          calYear = selDate.getFullYear();
          calMonth = selDate.getMonth();
        }
        renderCalendar();
      }

      customDateTrigger.addEventListener("click", toggleCalendar);

      calPrevMonth.addEventListener("click", function () {
        calMonth--;
        if (calMonth < 0) {
          calMonth = 11;
          calYear--;
        }
        renderCalendar();
      });

      calNextMonth.addEventListener("click", function () {
        calMonth++;
        if (calMonth > 11) {
          calMonth = 0;
          calYear++;
        }
        renderCalendar();
      });

      document.addEventListener("click", function (e) {
        if (calOpen && !dateBarWrapEl.contains(e.target)) {
          calOpen = false;
          renderCalendar();
        }
      });

      function applyRtdbPatch(path, data) {
        if (path === "/") {
          currentRecord = data;
        } else {
          if (!currentRecord || typeof currentRecord !== "object") currentRecord = {};
          const parts = path.split("/").filter(Boolean);
          let target = currentRecord;
          for (let i = 0; i < parts.length - 1; i++) {
            const key = parts[i];
            if (!target[key] || typeof target[key] !== "object") target[key] = {};
            target = target[key];
          }
          const leaf = parts[parts.length - 1];
          if (data && typeof data === "object" && !Array.isArray(data) && target[leaf] && typeof target[leaf] === "object") {
            Object.assign(target[leaf], data);
          } else {
            target[leaf] = data;
          }
        }
        syncTicker();
        render();
        if (currentRecord && currentRecord.status === "stopped" && eventSource) {
          eventSource.close();
          eventSource = null;
        }
      }

      function syncTicker() {
        const shouldTick =
          currentRecord &&
          currentRecord.mode === "live" &&
          currentRecord.status === "active" &&
          currentRecord.activeSession &&
          currentRecord.activeSession.isActive &&
          currentRecord.activeSession.startTime > 0;

        if (shouldTick && !tickInterval) {
          tickInterval = setInterval(render, 1000);
        } else if (!shouldTick && tickInterval) {
          clearInterval(tickInterval);
          tickInterval = null;
        }
      }

      async function init() {
        if (!shareId || !/^[a-zA-Z0-9_-]{4,32}$/.test(shareId)) {
          showError("Invalid share link", "Open a valid link generated from the Focus Lock app.");
          return;
        }

        const jsonUrl = RTDB_BASE + "/shared_stats/" + encodeURIComponent(shareId) + ".json";

        try {
          const resp = await fetch(jsonUrl);
          if (!resp.ok) {
            showError("Unable to load stats", "Please verify database read permissions for shared stats.");
            return;
          }
          const initialData = await resp.json();
          if (!initialData) {
            showError("Share link not found", "This link does not exist or has been removed.");
            return;
          }
          currentRecord = initialData;
          const { minKey, maxKey } = getBounds(currentRecord);
          const nowK = todayKey();
          selectedDateKey = (nowK >= minKey && nowK <= maxKey) ? nowK : maxKey;
          syncTicker();
          render();
        } catch (err) {
          showError("Connection error", "Unable to reach Focus Lock servers. Please try again.");
          return;
        }

        if (typeof EventSource !== "undefined" && currentRecord.mode === "live" && currentRecord.status === "active") {
          eventSource = new EventSource(jsonUrl);
          eventSource.addEventListener("put", function (e) {
            try {
              const payload = JSON.parse(e.data);
              applyRtdbPatch(payload.path, payload.data);
            } catch (_) {}
          });
          eventSource.addEventListener("patch", function (e) {
            try {
              const payload = JSON.parse(e.data);
              applyRtdbPatch(payload.path, payload.data);
            } catch (_) {}
          });
        }
      }

      init();
    })();
  </script>
</body>
</html>
